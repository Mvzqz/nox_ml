[project]
name = "nox-app"
version = "0.1.0"
description = "User interface: reads the results exported by nox-ml"
requires-python = ">=3.12"
# The app does not depend on nox-ml, only on the format of its exported results (data contract).
dependencies = [
    "streamlit>=1.38",
    "pydeck>=0.9",
    "pandas>=2.2",
    "pyarrow>=16",
    "altair>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nox_app"]
