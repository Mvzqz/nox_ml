[project]
name = "nox-ml"
version = "0.1.0"
description = "ML and physics pipelines: data, transport, inversion and validation of NOx emissions"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16",
    "geopandas>=1",
    "shapely>=2",
    "pyproj>=3.6",
    "xarray>=2024.6",
    "netcdf4>=1.7",
    "h5netcdf>=1.3",
    "requests>=2.32",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
pinn = ["torch>=2.4"]
hrrr = ["herbie-data>=2024.8", "cfgrib>=0.9.14"]

[project.scripts]
nox-ml = "nox_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nox_ml"]
