# Nov-Dec 2023, afternoons (the tuning period; feb-may 2024 is the test period and is never used here).
# Run: uv run nox-ml run configs/experiments/lognormal_map.yaml  ->  runs/lognormal_map/
name: lognormal_map
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours: [12, 17]
model:
  name: lognormal_map
  params: {prior_sd_mult: 1, sigma_theta_deg: 15, u_min_ms: 1, bootstrap_level: 0.90, seed: 7}  # Laplace intervals
placebo: {n: 2000, seed: 3, level: 0.90, refits: 8}
