# Nov-Dec 2023, afternoons (the tuning period; feb-may 2024 is the test period and is never used here).
# Run: uv run nox-ml run configs/experiments/regularized_ls.yaml  ->  runs/regularized_ls/
name: regularized_ls
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours: [12, 17]
model:
  name: regularized_ls
  params: {alpha: 0.01, penalty: prior, sigma_theta_deg: 15, u_min_ms: 1, bootstrap_n: 200, bootstrap_level: 0.90, seed: 7}  # NNLS ridge; bootstrap over whole days
placebo: {n: 2000, seed: 3, level: 0.90, refits: 8}
