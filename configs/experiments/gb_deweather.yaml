# Gradient boosting deweathering (nox_ml.models.gb_deweather): E6 with a HistGradientBoostingRegressor instead of
# the random forest. Same features, deweathering, log scale, index and intervals; relative, pooled over zones.
# Same data and placebo as baseline.yaml; only the model changes. Tuned with gb_deweather.search.yaml.
# Run: uv run nox-ml run configs/experiments/gb_deweather.yaml  ->  runs/gb_deweather/
name: gb_deweather
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours: [12, 17]
model:
  name: gb_deweather
  params:
    learning_rate: 0.1
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    drop_features: []       # feature columns taken out, e.g. [doy_sin, doy_cos]
    seed: 7
    background_ppb: 5.0     # as the baseline prior
    weather_samples: 20     # weather draws of the period per row
    bootstrap_n: 10
    bootstrap_level: 0.90
placebo: {n: 2000, seed: 3, level: 0.90, refits: 8}
