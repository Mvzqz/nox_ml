# pinn_puff with TEMPO converted with each hour's measured NO2/NOx (0.78 weekday, 0.85 Sunday) instead of the
# period's 0.774: improvement H3 of the adversarial review. Otherwise identical to pinn_puff.yaml.
name: pinn_puff_no2nox
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours:
- 12
- 17
model:
  name: pinn_puff
  params:
    layers: 4
    width: 64
    learning_rate: 0.002
    physics_weight: 1.0
    adam_steps: 3000
    lbfgs_rounds: 15
    kappa: 1500.0
    seed: 0
    tau_h: 12.0
    u_min: 2.0
    max_age_h: 24
    lifetime: oh
    bootstrap_n: 200
    bootstrap_level: 0.9
    kernel_dir: .cache/pinn
    hourly_no2_nox: true
placebo:
  n: 2000
  seed: 3
  level: 0.9
  refits: 8
