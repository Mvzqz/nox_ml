# PINN puff: the baseline inversion with the learned kernel applied to every segment of every puff
# (nox_ml.models.pinn.puff). Same data, priors and metrics as pinn_plume.yaml; only the transport changes.
# Run: uv run nox-ml run configs/experiments/pinn_puff.yaml  ->  runs/pinn_puff/
# The network of these parameters is bundled with the package (no training).
name: pinn_puff
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours: [12, 17]
model:
  name: pinn_puff
  params:
    layers: 4          # hidden layers
    width: 64          # neurons per layer
    learning_rate: 0.002
    physics_weight: 1.0
    adam_steps: 3000
    lbfgs_rounds: 15
    kappa: 1500.0      # turbulent diffusivity over wind speed (m); each value trains its own network
    seed: 0            # network and bootstrap
    tau_h: 12.0        # NOx lifetime (h); does not retrain
    u_min: 2.0         # transport speed floor (m/s), tuned (the baseline uses 1.0)
    max_age_h: 24      # hours a puff is followed; does not retrain
    lifetime: oh       # puffs survive by the OH-based loss rate of the inputs (tau_h only in the last hour)
    bootstrap_n: 200
    bootstrap_level: 0.90
    kernel_dir: .cache/pinn
placebo: {n: 2000, seed: 3, level: 0.90, refits: 8}
