# pinn_puff with the most probable state with every source >= 0 instead of the Gaussian mean, which gives
# some regions a negative emission. Otherwise identical to pinn_puff.yaml.
name: pinn_puff_nonneg
period:
  start: 2023-11-01
  end: 2023-12-31
simat_hours:
- 12
- 17
model:
  name: pinn_puff
  params:
    layers: 4
    width: 64
    learning_rate: 0.002
    physics_weight: 1.0
    adam_steps: 3000
    lbfgs_rounds: 15
    kappa: 1500.0
    seed: 0
    tau_h: 12.0
    u_min: 2.0
    max_age_h: 24
    lifetime: oh
    bootstrap_n: 200
    bootstrap_level: 0.9
    kernel_dir: .cache/pinn
    nonnegative: true
placebo:
  n: 2000
  seed: 3
  level: 0.9
  refits: 8
