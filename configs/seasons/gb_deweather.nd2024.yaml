# gb_deweather frozen (configs/experiments/gb_deweather.yaml) on nov-dec 2024: a season not used to choose anything.
name: gb_deweather.nd2024
period:
  start: '2024-11-01'
  end: '2024-12-31'
simat_hours:
- 12
- 17
model:
  name: gb_deweather
  params:
    learning_rate: 0.0993
    max_iter: 422
    max_leaf_nodes: 26
    min_samples_leaf: 7
    l2_regularization: 0.0967
    drop_features:
    - doy_sin
    - doy_cos
    seed: 7
    background_ppb: 5.0
    weather_samples: 20
    bootstrap_n: 10
    bootstrap_level: 0.9
placebo:
  n: 2000
  seed: 3
  level: 0.9
  refits: 8
