# Installed by `bin/uptodate`. Run everything by hand: `uv run pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]  # data goes to DVC
        exclude: ^(uv\.lock|docs/entregables/html/.*)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout  # notebooks are stored without outputs, except the Avance 4 and 5 deliverables
        exclude: ^notebooks/Avance[45]\.39\.ipynb$

  - repo: local
    hooks:
      # ruff and pyright run from uv.lock, so hooks and CI use the same versions.
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: fast-tests
        name: fast tests
        entry: uv run pytest -q -x -n auto
        language: system
        types: [python]
        pass_filenames: false
